<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WaveDash</title>
  <style>
    body {
      background-color: #333333;
      color: white;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <h1>WaveDash</h1>
  <h2>Account</h2>
  <div id="alpaca-disconnected">
    <div>
      <label for="alpaca-paper">Alpaca Paper: </label>
      <input id="alpaca-paper" type="checkbox"></input>
    </div>
    <div>
      <label for="alpaca-key">Alpaca Key: </label>
      <input id="alpaca-key"></input>
    </div>
    <div>
      <label for="alpaca-secret">Alpaca Secret: </label>
      <input id="alpaca-secret" type="password"></input>
    </div>
    <button id="alpaca-connect">Alpaca Connect</button>
  </div>
  <div id="alpaca-connected">
    <div>Alpaca Account Number: <span id="alpaca-account-number"></span></div>
    <div>Alpaca Cash: <span id="alpaca-cash"></span></div>
    <div>Alpaca Buying Power: <span id="alpaca-buying-power"></span></div>
    <button id="alpaca-disconnect">Alpaca Disconnect</button>
  </div>
  <h2>Order Entry</h2>
  <div>
    <div>
      <label for="order-entry-symbol">Symbol: </label>
      <input id="order-entry-symbol"></input>
    </div>
    <div>
      <label for="order-entry-quantity">Quantity: </label>
      <input id="order-entry-quantity" type="number" min="0"></input>
    </div>
    <div>
      <label for="order-entry-order-type">Order Type: </label>
      <select id="order-entry-order-type">
        <option value="market">Market</option>
        <option value="limit">Limit</option>
      </select>
    </div>
    <div id="order-entry-limit">
      <label for="order-entry-limit-price">Limit Price: </label>
      <input id="order-entry-limit-price" type="number" min="0" step="0.01"></input>
    </div>
    <div>
      <button id="order-entry-buy">Buy</button>
      <button id="order-entry-sell">Sell</button>
    </div>
  </div>
  <h3>Hot Buttons</h3>
  <button id="order-entry-cancel">Cancel All Orders</button>
  <h3>NBBO</h3>
  <div>
    <div id="nbbo-symbol"></div>
    <div id="nbbo-underlying"></div>
  </div>
  <h2>Positions</h2>
  <div id="positions"></div>
  <h2>Orders</h2>
  <div id="orders"></div>
  <h2>Options</h2>
  <button id="options-load-contracts">Load Contracts</button>
  <div id="options-contracts">
    <div>Underlying: <span id="options-underlying"></span></div>
    <div>
      <label for="option-side">Side: </label>
      <select id="option-side">
        <option value="call">Call</option>
        <option value="put">Put</option>
      </select>
    </div>
    <div>
      <label for="option-expirations">Expiration: </label>
      <select id="option-expirations"></select>
    </div>
    <div>
      <label for="option-strikes">Strike: </label>
      <select id="option-strikes"></select>
    </div>
    <button id="options-set-symbol">Set Symbol To Contract</button>
  </div>
  <h2>Log</h2>
  <div id="log-entries"></div>
  <script type="module">
    import {e, useState, useRetainedState} from "https://esm.sh/gh/dawsonfrakes/deact/deact.mjs"
    import {encode as encodeMsgpack, decode as decodeMsgpack} from "https://esm.sh/@msgpack/msgpack"

    const upperFirst = text => text.slice(0, 1).toUpperCase() + text.slice(1)
    const dollars = text => new Intl.NumberFormat("en-US", {style: "currency", currency: "USD"}).format(text)

    const alpacaPaper = useRetainedState("alpaca-paper", true)
    const alpacaKey = useRetainedState("alpaca-key", "")
    const alpacaSecret = useRetainedState("alpaca-secret", "")
    const alpacaConnecting = useState(false)
    const alpacaConnected = useState(false)
    const alpacaPositions = useState([])
    const alpacaOrders = useState([])
    const alpacaStockDataConnected = useState(false)
    const alpacaStockDataWs = useState(null)
    const alpacaOptionDataConnected = useState(false)
    const alpacaOptionDataWs = useState(null)
    const alpacaQuotes = useState({})
    const orderEntrySymbol = useRetainedState("order-entry-symbol", "")
    const orderEntryQuantity = useState("0")
    const orderEntryOrderType = useState("market")
    const orderEntryLimitPrice = useState("0.00")
    const optionsContracts = useState([])
    const optionsExpirations = useState([])
    const optionsStrikes = useState([])
    const optionsUnderlying = useState("")
    const optionsSide = useState("call")
    const optionsExpiration = useState("")
    const optionsStrike = useState("")
    const log = useState([])

    const info = text => log.val = [{kind: "info", time: new Date(), text}, ...log.val]
    const warn = text => log.val = [{kind: "warn", time: new Date(), text}, ...log.val]
    const error = text => log.val = [{kind: "error", time: new Date(), text}, ...log.val]
    const alpacaFetch = async (method, endpoint, body) => {
      const url = alpacaPaper.val ? "https://paper-api.alpaca.markets" : "https://api.alpaca.markets"
      const res = await fetch(`${url}${endpoint}`, {
        method,
        headers: {
          Accept: "application/json",
          "Content-Type": "application/json",
          "APCA-API-KEY-ID": alpacaKey.val,
          "APCA-API-SECRET-KEY": alpacaSecret.val
        },
        body: body !== undefined ? JSON.stringify(body) : undefined
      })
      if (!res.ok) throw new Error(res.statusText)
      return res.json()
    }
    const alpacaSubscribe = () => {
      if (!alpacaConnected.val || !alpacaStockDataConnected.val || !alpacaOptionDataConnected.val) return
      if (orderEntrySymbol.oldVal !== undefined && orderEntrySymbol.oldVal !== "") {
       if (orderEntrySymbol.oldVal.length > 5) {
          alpacaOptionDataWs.val.send(encodeMsgpack({action: "unsubscribe", quotes: [orderEntrySymbol.val]}))
        } else {
          alpacaStockDataWs.val.send(JSON.stringify({action: "unsubscribe", quotes: [orderEntrySymbol.val]}))
        }
      }
      if (orderEntrySymbol.val !== "") {
        if (orderEntrySymbol.val.length > 5) {
          alpacaOptionDataWs.val.send(encodeMsgpack({action: "subscribe", quotes: [orderEntrySymbol.val]}))
        } else {
          alpacaStockDataWs.val.send(JSON.stringify({action: "subscribe", quotes: [orderEntrySymbol.val]}))
        }
      }
      if (optionsUnderlying.oldVal !== undefined && optionsUnderlying.oldVal !== "") {
        alpacaStockDataWs.val.send(JSON.stringify({action: "unsubscribe", quotes: [optionsUnderlying.oldVal]}))
      }
      if (optionsUnderlying.val !== "" && optionsUnderlying.val !== orderEntrySymbol.val) {
        alpacaStockDataWs.val.send(JSON.stringify({action: "subscribe", quotes: [optionsUnderlying.val]}))
      }
    }
    const optionsUpdateValidExpirations = () => {
      const newExpirations = []
      for (const contract of optionsContracts.val) {
        if (contract.type === optionsSide.val) {
          newExpirations.push(contract.expiration_date)
        }
      }
      optionsExpirations.val = [...new Set(newExpirations)]
      optionsExpiration.val = optionsExpirations.val[0]
    }
    const optionsUpdateValidStrikes = () => {
      const newStrikes = []
      for (const contract of optionsContracts.val) {
        if (contract.type === optionsSide.val && contract.expiration_date === optionsExpiration.val) {
          newStrikes.push(contract.strike_price)
        }
      }
      optionsStrikes.val = [...new Set(newStrikes)]
      optionsStrike.val = optionsStrikes.val[0]
      if (alpacaQuotes.val[optionsUnderlying.val] !== undefined) {
        const ap = alpacaQuotes.val[optionsUnderlying.val].ap
        optionsStrike.val = optionsStrikes.val.reduce((prev, curr) => Math.abs(ap - prev) < Math.abs(ap - curr) ? prev : curr)
      }
    }

    alpacaQuotes.sub(() => {
      e`nbbo-symbol`.hidden = orderEntrySymbol.val === "" || alpacaQuotes.val[orderEntrySymbol.val] === undefined || orderEntrySymbol.val === optionsUnderlying.val
      e`nbbo-underlying`.hidden = optionsUnderlying.val === "" || alpacaQuotes.val[optionsUnderlying.val] === undefined
      if (alpacaQuotes.val[orderEntrySymbol.val] !== undefined) {
        const q = alpacaQuotes.val[orderEntrySymbol.val]
        e`nbbo-symbol`.textContent = `${orderEntrySymbol.val}: ${q.bs} ${dollars(q.bp)} x ${q.as} ${dollars(q.ap)}`
      }
      if (alpacaQuotes.val[optionsUnderlying.val] !== undefined) {
        const q = alpacaQuotes.val[optionsUnderlying.val]
        e`nbbo-underlying`.textContent = `${optionsUnderlying.val}: ${q.bs} ${dollars(q.bp)} x ${q.as} ${dollars(q.ap)}`
      }
    })
    alpacaPaper.sub(() => {
      e`alpaca-paper`.checked = alpacaPaper.val
      e`alpaca-paper`.oninput = e => alpacaPaper.val = e.target.checked
    })
    alpacaKey.sub(() => {
      e`alpaca-key`.value = alpacaKey.val
      e`alpaca-key`.oninput = e => alpacaKey.val = e.target.value
    })
    alpacaSecret.sub(() => {
      e`alpaca-secret`.value = alpacaSecret.val
      e`alpaca-secret`.oninput = e => alpacaSecret.val = e.target.value
    })
    alpacaConnecting.sub(() => {
      e`alpaca-connect`.disabled = alpacaConnecting.val
    })
    alpacaConnected.sub(() => {
      e`alpaca-disconnected`.hidden = alpacaConnected.val
      e`alpaca-connected`.hidden = !alpacaConnected.val
    })
    e`alpaca-connect`.onclick = () => {
      alpacaConnecting.val = true
      alpacaFetch("GET", "/v2/account")
        .then(res => {
          e`alpaca-account-number`.textContent = res.account_number
          e`alpaca-cash`.textContent = dollars(res.cash)
          e`alpaca-buying-power`.textContent = dollars(res.buying_power)
          alpacaFetch("GET", "/v2/positions")
            .then(res => alpacaPositions.val = res)
          alpacaFetch("GET", "/v2/orders")
            .then(res => alpacaOrders.val = res)

          info("Alpaca connected.")
          alpacaConnected.val = true
          alpacaConnecting.val = false

          {
            const url = alpacaPaper.val ? "wss://paper-api.alpaca.markets/stream" : "wss://api.alpaca.markets/stream"
            const ws = new WebSocket(url)
            ws.onopen = e => {
              ws.send(JSON.stringify({action: "auth", key: alpacaKey.val, secret: alpacaSecret.val}))
            }
            ws.onmessage = async e => {
              const msg = JSON.parse(await e.data.text())
              if (msg.stream === "authorization") {
                if (msg.data.status === "authorized") {
                  ws.send(JSON.stringify({action: "listen", data: {streams: ["trade_updates"]}}))
                }
              }
              if (msg.stream === "listening") {
                info("Alpaca trade update stream connected.")
              }
              if (msg.stream === "trade_updates") {
                const newOrder = msg.data.order
                let found = false
                for (let i = 0; i < alpacaOrders.val.length; i++) {
                  const order = alpacaOrders.val[i]
                  if (order.id === newOrder.id) {
                    alpacaOrders.val = [...alpacaOrders.val.slice(0, i), newOrder, ...alpacaOrders.val.slice(i + 1)]
                    found = true
                    break
                  }
                }
                if (!found) alpacaOrders.val = [...alpacaOrders.val, newOrder]
                if (msg.data.event === "fill" || msg.data.event === "partial_fill") {
                  alpacaFetch("GET", "/v2/positions")
                    .then(res => alpacaPositions.val = res)
                }
              }
            }
          }

          {
            const ws = new WebSocket("wss://stream.data.alpaca.markets/v2/sip")
            alpacaStockDataWs.val = ws
            ws.onopen = e => {
              ws.send(JSON.stringify({action: "auth", key: alpacaKey.val, secret: alpacaSecret.val}))
            }
            ws.onmessage = async e => {
              const msgs = JSON.parse(e.data)
              for (const msg of msgs) {
                if (msg.T === "success" && msg.msg === "connected") {
                  info("Alpaca stock market data stream connected.")
                  alpacaStockDataConnected.val = true
                  alpacaSubscribe()
                }
                if (msg.T === "q") {
                  alpacaQuotes.val = {...alpacaQuotes.val, [msg.S]: msg}
                }
              }
            }
            ws.onclose = e => {
              alpacaStockDataConnected.val = false
              alpacaStockDataWs.val = null
            }
          }

          {
            const ws = new WebSocket("wss://stream.data.alpaca.markets/v1beta1/opra")
            alpacaOptionDataWs.val = ws
            ws.onopen = e => {
              ws.send(encodeMsgpack({action: "auth", key: alpacaKey.val, secret: alpacaSecret.val}))
            }
            ws.onmessage = async e => {
              const msgs = decodeMsgpack(await e.data.arrayBuffer())
              for (const msg of msgs) {
                if (msg.T === "success" && msg.msg === "connected") {
                  info("Alpaca option market data stream connected.")
                  alpacaOptionDataConnected.val = true
                  alpacaSubscribe()
                }
                if (msg.T === "q") {
                  alpacaQuotes.val = {...alpacaQuotes.val, [msg.S]: msg}
                }
              }
            }
            ws.onclose = e => {
              alpacaOptionDataConnected.val = false
              alpacaOptionDataWs.val = null
            }
          }
        })
        .catch(err => {
          error(`Alpaca failed to connect. ${err}`)
          alpacaConnecting.val = false
        })
    }
    e`alpaca-disconnect`.onclick = () => {
      info("Alpaca disconnected.")
      alpacaConnected.val = false
    }
    alpacaPositions.sub(() => {
      const nodes = []
      for (const position of alpacaPositions.val) {
        const node = document.createElement("div")
        node.textContent = `${upperFirst(position.side)} ${position.qty} ${position.symbol} @ ${dollars(position.avg_entry_price)}`
        nodes.push(node)
      }
      e`positions`.replaceChildren(...nodes)
    })
    alpacaOrders.sub(() => {
      const nodes = []
      for (const order of alpacaOrders.val) {
        if (order.status === "pending_new" || order.status === "new" || order.status === "accepted" || order.status === "partially_filled" || order.status === "pending_cancel") {
          const node = document.createElement("div")
          node.textContent = `${upperFirst(order.side)} ${order.filled_qty}/${order.qty} ${order.symbol} @ ${order.limit_price !== undefined ? dollars(order.limit_price) : "MKT"}`
          nodes.push(node)
        }
      }
      e`orders`.replaceChildren(...nodes)
    })
    orderEntrySymbol.sub(() => {
      e`order-entry-symbol`.value = orderEntrySymbol.val
      e`order-entry-symbol`.oninput = e => orderEntrySymbol.val = e.target.value.toUpperCase()
      alpacaSubscribe()
    })
    orderEntryQuantity.sub(() => {
      e`order-entry-quantity`.value = orderEntryQuantity.val
      e`order-entry-quantity`.oninput = e => orderEntryQuantity.val = e.target.value
    })
    orderEntryOrderType.sub(() => {
      e`order-entry-order-type`.value = orderEntryOrderType.val
      e`order-entry-order-type`.oninput = e => orderEntryOrderType.val = e.target.value
      e`order-entry-limit`.hidden = orderEntryOrderType.val !== "limit"
    })
    orderEntryLimitPrice.sub(() => {
      e`order-entry-limit-price`.value = orderEntryLimitPrice.val
      e`order-entry-limit-price`.oninput = e => orderEntryLimitPrice.val = e.target.value
    })
    e`order-entry-buy`.onclick = () => {
      if (!alpacaConnected.val) return
      alpacaFetch("POST", "/v2/orders", {
        time_in_force: "day",
        extended_hours: orderEntryOrderType.val === "limit" ? true : undefined,
        type: orderEntryOrderType.val,
        qty: orderEntryQuantity.val,
        limit_price: orderEntryOrderType.val === "limit" ? orderEntryLimitPrice.val : undefined,
        side: "buy",
        symbol: orderEntrySymbol.val
      })
        .then(res => info("Alpaca order placed."))
        .catch(err => error(`Alpaca order failed. ${err}`))
    }
    e`order-entry-sell`.onclick = () => {
      if (!alpacaConnected.val) return
      alpacaFetch("POST", "/v2/orders", {
        time_in_force: "day",
        extended_hours: orderEntryOrderType.val === "limit" ? true : undefined,
        type: orderEntryOrderType.val,
        qty: orderEntryQuantity.val,
        limit_price: orderEntryOrderType.val === "limit" ? orderEntryLimitPrice.val : undefined,
        side: "sell",
        symbol: orderEntrySymbol.val
      })
        .then(res => info("Alpaca order placed."))
        .catch(err => error(`Alpaca order failed. ${err}`))
    }
    e`order-entry-cancel`.onclick = () => {
      if (!alpacaConnected.val) return
      alpacaFetch("DELETE", "/v2/orders")
    }
    e`options-load-contracts`.onclick = () => {
      if (!alpacaConnected.val || orderEntrySymbol.val === "") return
      alpacaFetch("GET", `/v2/options/contracts?underlying_symbols=${orderEntrySymbol.val}&expiration_date_gte=${new Date().toISOString().split("T")[0]}&limit=10000`)
        .then(res => {
          if (res.option_contracts.length > 0) {
            optionsUnderlying.val = orderEntrySymbol.val
            optionsContracts.val = res.option_contracts
            info("Alpaca loaded options contracts.")
          }
        })
        .catch(err => warn(`${err}`))
    }
    optionsContracts.sub(() => {
      optionsUpdateValidExpirations()
    })
    optionsUnderlying.sub(() => {
      e`options-contracts`.hidden = optionsUnderlying.val === ""
      e`options-underlying`.textContent = optionsUnderlying.val
      alpacaSubscribe()
    })
    optionsExpirations.sub(() => {
      const nodes = []
      for (const expiration of optionsExpirations.val) {
        const node = document.createElement("option")
        node.value = expiration
        node.textContent = expiration
        nodes.push(node)
      }
      e`option-expirations`.replaceChildren(...nodes)
    })
    optionsStrikes.sub(() => {
      const nodes = []
      for (const strike of optionsStrikes.val) {
        const node = document.createElement("option")
        node.value = strike
        node.textContent = dollars(strike)
        nodes.push(node)
      }
      e`option-strikes`.replaceChildren(...nodes)
    })
    optionsSide.sub(() => {
      optionsUpdateValidExpirations()
      e`option-side`.value = optionsSide.val
      e`option-side`.oninput = e => {
        optionsSide.val = e.target.value
        optionsUpdateValidExpirations()
      }
    })
    optionsExpiration.sub(() => {
      optionsUpdateValidStrikes()
      e`option-expirations`.value = optionsExpiration.val
      e`option-expirations`.oninput = e => {
        optionsExpiration.val = e.target.value
        optionsUpdateValidStrikes()
      }
    })
    optionsStrike.sub(() => {
      e`option-strikes`.value = optionsStrike.val
      e`option-strikes`.oninput = e => optionsStrike.val = e.target.value
    })
    e`options-set-symbol`.onclick = () => {
      for (const contract of optionsContracts.val) {
        if (contract.type === optionsSide.val &&
            contract.expiration_date === optionsExpiration.val &&
            contract.strike_price === optionsStrike.val)
        {
          orderEntrySymbol.val = contract.symbol
          break
        }
      }
    }
    log.sub(() => {
      const nodes = []
      for (const entry of log.val) {
        const node = document.createElement("div")
        node.textContent = `${upperFirst(entry.kind)} | ${entry.time.toLocaleTimeString()} | ${entry.text}`
        nodes.push(node)
      }
      e`log-entries`.replaceChildren(...nodes)
    })
  </script>
</body>
</html>
